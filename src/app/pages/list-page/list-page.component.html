<main>
  <h1>Pokémon browser</h1>
  <p>Favourites: {{ favouritesCount() }}</p>

  @if (loading()) {
    <p>Loading...</p>
  } @else if (error()) {
    <p>Error: {{ error() }}</p>
  } @else {
    <input [formControl]="searchControl" placeholder="Search Pokémon" />
    <p>{{ matches().length }} results</p>
    <ul>
      @for (p of matches().slice(0, 50); track p.name) {
        <li>
          <a [routerLink]="['/pokemon', p.name]">{{ p.name }}</a>
          <app-favourite-button [name]="p.name" />
        </li>
      }
    </ul>
  }
</main>
